name: rustapp-addon

services:
  db:
    image: postgres:17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: rustapp_addon
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s
  api:
    image: rustapp-addon-backend:prod
    build:
      context: ./backend
      target: prod
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
    - "no-new-privileges:true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).close()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - app_db_password
    stop_grace_period: 30s
  worker:
    profiles: ["tools"]
    image: rustapp-addon-backend:prod
    build:
      context: ./backend
      target: prod
    command: ["python", "-m", "app.workers.scan_players"]
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - app_rustapp_access_token
      - app_db_password
  listener:
    profiles: ["tools"]
    image: rustapp-addon-backend:prod
    build:
      context: ./backend
      target: prod
    command: ["python", "-m", "app.workers.listen_player_status"]
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - app_rustapp_access_token
      - app_db_password
  ban-guard:
    profiles: ["tools"]
    image: rustapp-addon-backend:prod
    build:
      context: ./backend
      target: prod
    command: ["uvicorn", "app.ban_guard.api:app", "--host", "0.0.0.0", "--port", "8000"]
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - app_db_password
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 6
  moderation:
    profiles: ["tools"]
    image: rustapp-addon-backend:prod
    build:
      context: ./backend
      target: prod
    command: ["python", "-m", "app.workers.moderate_players"]
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_MODERATION_INITIAL_BAN_PAGES:
      APP_MODERATION_REQUEST_INTERVAL:
      APP_MODERATION_POLL_SECONDS:
      APP_MODERATION_ENFORCE: ${APP_MODERATION_ENFORCE:-false}
      APP_MODERATION_PATTERNS: ${APP_MODERATION_PATTERNS:-{}}
      APP_MODERATION_SERVER_ID: ${APP_MODERATION_SERVER_ID:-163}
    depends_on:
      ban-guard:
        condition: service_healthy
      db:
        condition: service_healthy
    secrets:
      - app_rustapp_access_token
      - app_db_password
  research:
    profiles: ["tools"]
    image: rustapp-addon-backend:prod
    build:
      context: ./backend
      target: prod
    command: ["python", "-m", "app.workers.research_players"]
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      APP_MODERATION_SERVER_ID: ${APP_MODERATION_SERVER_ID:-163}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - app_rustapp_access_token
      - app_db_password
  migrate:
    profiles: ["tools"]
    image: rustapp-addon-backend:prod
    build:
      context: ./backend
      target: prod
    command: ["alembic", "upgrade", "head"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - app_db_password

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  app_rustapp_access_token:
    file: ./secrets/app_rustapp_access_token
  app_db_password:
    file: ./secrets/app_db_password

volumes:
  pgdata:
